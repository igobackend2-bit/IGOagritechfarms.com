server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Canonicalize every request to https://www.igoagritechfarms.com.
    # Traefik terminates TLS in front of this container and forwards the
    # original scheme via X-Forwarded-Proto, so we trust that header here
    # to decide whether the original request was http or https.
    if ($http_x_forwarded_proto != "https") {
        return 301 https://www.igoagritechfarms.com$request_uri;
    }
    if ($host != "www.igoagritechfarms.com") {
        return 301 https://www.igoagritechfarms.com$request_uri;
    }

    # Single-page app: any URL that isn't a real file falls back to index.html
    # so React Router can handle the route on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed, immutable build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML shell itself, so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
