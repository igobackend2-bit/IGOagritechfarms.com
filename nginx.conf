# NOTE on HTTPS: this file intentionally only configures plain HTTP (port 80).
# No certificate files exist in this repo, so adding a `listen 443 ssl;`
# block here without one would fail to start the container. If this image
# is ever run directly internet-facing (rather than behind Netlify/Vercel,
# which already terminate TLS and force HTTPS automatically), add:
#   1. `listen 443 ssl;` + `ssl_certificate`/`ssl_certificate_key` pointing
#      at real cert files (e.g. via a mounted Let's Encrypt volume), and
#   2. a `server { listen 80; return 301 https://$host$request_uri; }`
#      block to redirect plain HTTP to HTTPS.
# More commonly this container sits behind a load balancer/reverse proxy
# (Cloudflare, an ALB, a Certbot sidecar, etc.) that already handles TLS
# termination and HTTP->HTTPS redirection — check that layer first.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Canonical host is https://www.igoagritechfarms.com (per SEO.tsx's
    # canonical tags and sitemap.xml). The bare/non-www domain resolves to
    # this same container, so without this redirect both hosts serve
    # identical content instead of consolidating to one canonical URL.
    if ($host = "igoagritechfarms.com") {
        return 301 https://www.igoagritechfarms.com$request_uri;
    }

    # Compress text-based responses (JS/CSS/HTML/JSON/SVG) before sending.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Single-page app: any URL that isn't a real file falls back to the
    # neutral pre-render CSR shell (200.html), not index.html — the build's
    # prerender step (scripts/prerender.mjs) overwrites index.html with the
    # homepage's own fully rendered content, so reusing it here would serve
    # a full duplicate copy of the homepage for every broken/nonexistent
    # URL. React Router takes over client-side from 200.html and renders
    # the real NotFound page.
    location / {
        # Check for an exact file, then that directory's own index.html,
        # then fall back to the neutral shell. Using "$uri/index.html"
        # instead of the bare "$uri/" avoids nginx's directory-listing
        # behavior, which returns a hard 403 for any directory that exists
        # on disk (because a deeper prerendered sub-page lives inside it)
        # but has no index.html of its own — e.g. /projects/agri/ exists
        # only because /projects/agri/polyhouse/index.html does, not
        # because /projects/agri itself is a real page.
        try_files $uri $uri/index.html /200.html;
    }

    # Long-lived caching for hashed, immutable build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache any HTML shell/prerendered page, so new deploys (and
    # updated meta tags) are picked up immediately — this now also covers
    # the per-route index.html files written by the prerender build step,
    # plus the 200.html SPA-fallback shell.
    location ~ /(index|200)\.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
