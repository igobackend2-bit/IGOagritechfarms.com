server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any URL that isn't a real file falls back to index.html
    # so React Router can handle the route on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed, immutable build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML shell itself, so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
